name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Fengari stays outside the repo, as it does locally.
      - name: Install Fengari
        run: npm install --no-save --prefix "$RUNNER_TEMP/lua-harness" fengari@0.1.5
      - name: Run tests
        env:
          FENGARI_HOME: ${{ runner.temp }}/lua-harness
        run: node tests/run.cjs
